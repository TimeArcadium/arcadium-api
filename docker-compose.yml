version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: arcadium_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d arcadium_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: sh -c "node dist/main.js"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://dev:dev@db:5432/arcadium_dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_SERVICE_NAME: arcadium-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
